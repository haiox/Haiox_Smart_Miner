    <rect x="12" y="306" width="196" height="48" rx="6" fill="#260b1e" stroke="#e11d48"/>
    <text x="20" y="322" class="item-title" fill="#fb7185">13. JSON-LD Graph Resolver</text>
    <text x="20" y="336" class="item-desc">19k ops/s · Cross-node @id unroller</text>
    <text x="20" y="348" class="item-desc">Articles, Products, FAQs, Breadcrumbs</text>

    <rect x="12" y="360" width="196" height="48" rx="6" fill="#061f2d" stroke="#0284c7"/>
    <text x="20" y="376" class="item-title" fill="#38bdf8">14. Evidence Grounding Packager</text>
    <text x="20" y="390" class="item-desc">SHA-256 fingerprint · Token budgeting</text>
    <text x="20" y="402" class="item-desc">GFM XML &lt;haiox_evidence&gt; blocks</text>
