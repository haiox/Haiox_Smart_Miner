    <text x="24" y="86" class="item-title" fill="#6ee7b7">1. Zero-Trust SSRF Shield</text>
    <text x="24" y="101" class="item-desc">35,000 ops/sec · Latency &lt;30µs</text>
    <text x="24" y="116" class="item-desc">Guarantees zero internal network leaks</text>

