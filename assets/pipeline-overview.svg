    <text x="20" y="257" class="item-desc">Blocks 169.254.169.254</text>
    <text x="20" y="271" class="item-desc">AWS / GCP / Azure meta</text>
    <text x="20" y="285" class="item-desc">Alibaba / Oracle drop</text>
    <text x="20" y="299" class="item-desc">Latency: &lt; 0.03 ms</text>

    <rect x="12" y="324" width="156" height="80" rx="6" fill="#081020" stroke="#1e293b"/>
    <text x="20" y="342" class="item-title" fill="#10b981">In-Memory DNS Cache</text>
