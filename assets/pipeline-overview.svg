  <style>
    .brand-title { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 2px; fill: #38bdf8; }
    .card-title { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .card-sub { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #6ee7b7; }
    .item-title { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
    .item-desc { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-size: 10px; font-weight: 400; fill: #94a3b8; }
    .code-pill { font-family: 'Consolas', 'Fira Code', monospace; font-size: 10px; font-weight: 600; }
