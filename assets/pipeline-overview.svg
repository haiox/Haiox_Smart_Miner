    <rect x="10" y="68" width="120" height="96" rx="6" fill="#1b1035" stroke="#7c3aed"/>
    <text x="16" y="86" class="item-title" fill="#c084fc">Haiox Orchestrator</text>
    <text x="16" y="103" class="item-desc">Token governance</text>
    <text x="16" y="117" class="item-desc">Budget allocation</text>
    <text x="16" y="131" class="item-desc">Workflow routing</text>
