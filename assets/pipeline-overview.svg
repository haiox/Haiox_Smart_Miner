    <text x="20" y="171" class="item-desc">Zero OS socket open</text>
    <text x="20" y="186" class="item-desc">Link-local / loopback drop</text>
    <text x="20" y="200" class="item-desc">RFC 1918 / 4193 audit</text>

    <rect x="12" y="224" width="156" height="88" rx="6" fill="#081020" stroke="#1e293b"/>
