[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haiox-smart-miner"
version = "2.0.0"
description = "Enterprise Zero-Trust Web Ingestion & Structural Parsing Engine (Top-10 Web Miner)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Haiox"}]
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "markdownify>=1,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "starlette>=0.36,<1"]
demo = ["streamlit>=1.35,<2"]

[project.scripts]
smart-miner = "smart_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_miner = ["py.typed"]
